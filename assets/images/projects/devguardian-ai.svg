  <text x="255" y="222" fill="#ffdb70" font-family="monospace" font-size="11">const result = eval(query); // ⚠ VULN</text>

  <text x="215" y="248" fill="#666875" font-family="monospace" font-size="11">06</text>
  <text x="255" y="248" fill="#d6d6d6" font-family="monospace" font-size="11">return sanitize(result);</text>

  <text x="215" y="270" fill="#666875" font-family="monospace" font-size="11">07</text>
  <text x="240" y="270" fill="#d6d6d6" font-family="monospace" font-size="11">}</text>

