  <text x="548" y="320" fill="#78c878" font-family="monospace" font-size="10">+ const parser = new QueryParser();</text>
  <text x="548" y="336" fill="#78c878" font-family="monospace" font-size="10">+ const result = parser.execute(query);</text>

  <rect x="540" y="358" width="210" height="24" rx="4" fill="url(#goldAcc)"/>
  <text x="645" y="374" fill="#121212" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">APPLY AGENT PATCH</text>

