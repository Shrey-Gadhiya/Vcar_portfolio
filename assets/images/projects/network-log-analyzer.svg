  <text x="75" y="363" fill="#d6d6d6" font-family="monospace" font-size="12">10:42:22.890</text>
  <text x="210" y="363" fill="#ffdb70" font-family="monospace" font-size="12" font-weight="600">45.142.212.8</text>
  <text x="350" y="363" fill="#d6d6d6" font-family="monospace" font-size="12">192.168.1.1:22</text>
  <text x="490" y="363" fill="#d6d6d6" font-family="monospace" font-size="12">SSH BruteForce</text>
