  <text x="75" y="320" fill="#d6d6d6" font-family="monospace" font-size="12">10:42:21.155</text>
  <text x="210" y="278" y="320" fill="#d6d6d6" font-family="monospace" font-size="12">192.168.1.88</text>
  <text x="350" y="320" fill="#d6d6d6" font-family="monospace" font-size="12">142.250.190.46:443</text>
