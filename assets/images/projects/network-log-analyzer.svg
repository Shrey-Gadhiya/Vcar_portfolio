  <rect x="625" y="304" width="75" height="22" rx="4" fill="#202a20" stroke="#387038" stroke-width="1"/>
  <text x="662" y="319" fill="#78c878" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">CLEAN</text>
