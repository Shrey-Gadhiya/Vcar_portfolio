  <text x="75" y="405" fill="#d6d6d6" font-family="monospace" font-size="12">10:42:25.104</text>
  <text x="210" y="405" fill="#d6d6d6" font-family="monospace" font-size="12">192.168.1.15</text>
  <text x="350" y="405" fill="#d6d6d6" font-family="monospace" font-size="12">172.217.16.206:443</text>
  <text x="490" y="405" fill="#d6d6d6" font-family="monospace" font-size="12">HTTPS ACK</text>
  <rect x="625" y="389" width="75" height="22" rx="4" fill="#202a20" stroke="#387038" stroke-width="1"/>
  <text x="662" y="404" fill="#78c878" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">CLEAN</text>

