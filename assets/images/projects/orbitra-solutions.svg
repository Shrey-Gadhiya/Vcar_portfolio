  <text x="70" y="254" fill="#d6d6d6" font-family="sans-serif" font-size="11">💰 GST &amp; Tax Setup</text>
  <text x="70" y="286" fill="#d6d6d6" font-family="sans-serif" font-size="11">🗄 SQLite DB Sync</text>

  <rect x="55" y="325" width="160" height="110" rx="6" fill="#1c1d24" stroke="#2d2d35" stroke-width="1"/>
  <text x="68" y="348" fill="#a0a0a5" font-family="sans-serif" font-size="10">THIS MONTH SALES</text>
  <text x="68" y="375" fill="#ffdb70" font-family="monospace" font-size="18" font-weight="700">₹4,82,500</text>
  <text x="68" y="398" fill="#78c878" font-family="sans-serif" font-size="10">▲ 24% vs Prev Month</text>
  <text x="68" y="420" fill="#a0a0a5" font-family="sans-serif" font-size="10">42 Invoices Generated</text>

  <!-- Right: Estimate Document Preview -->
  <rect x="240" y="90" width="515" height="360" rx="8" fill="#141418" stroke="#2d2d35" stroke-width="1"/>
  
  <!-- Invoice Header -->
  <text x="265" y="125" fill="#ffdb70" font-family="sans-serif" font-size="16" font-weight="800">ORBITRA ESTIMATE #ORB-2026-104</text>
  <text x="630" y="125" fill="#a0a0a5" font-family="monospace" font-size="11">DATE: 20-OCT-2026</text>
  <line x1="265" y1="140" x2="730" y2="140" stroke="#2c2d35" stroke-width="1"/>

  <!-- Client & Job Info -->
  <text x="265" y="162" fill="#a0a0a5" font-family="sans-serif" font-size="10" font-weight="600">CLIENT / CUSTOMER:</text>
  <text x="265" y="178" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Apex Infrastructure Ltd, Surat</text>
  
  <text x="510" y="162" fill="#a0a0a5" font-family="sans-serif" font-size="10" font-weight="600">PAYMENT TERMS:</text>
  <text x="510" y="178" fill="#ffffff" font-family="sans-serif" font-size="12">Net 30 Days (GST Incl.)</text>

  <!-- Line Items Table -->
  <rect x="265" y="195" width="465" height="155" rx="6" fill="#1a1b22" stroke="#2c2d35" stroke-width="1"/>
  
