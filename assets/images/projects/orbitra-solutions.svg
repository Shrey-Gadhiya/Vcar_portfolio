<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="orbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17181c"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="goldOrb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffdb70"/>
      <stop offset="100%" stop-color="#e0aa3e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#orbBg)"/>
  <rect x="25" y="25" width="750" height="450" rx="12" fill="#1b1c21" stroke="#363740" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="25" y="25" width="750" height="48" rx="12" fill="#24252c"/>
  <rect x="25" y="60" width="750" height="13" fill="#24252c"/>
  <line x1="25" y1="73" x2="775" y2="73" stroke="#363740" stroke-width="1"/>
  <circle cx="50" cy="49" r="6" fill="#ff5f56"/>
  <circle cx="68" cy="49" r="6" fill="#ffbd2e"/>
  <circle cx="86" cy="49" r="6" fill="#27c93f"/>
  <text x="400" y="54" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Orbitra Solutions — Commercial Estimate &amp; Invoicing Platform</text>

