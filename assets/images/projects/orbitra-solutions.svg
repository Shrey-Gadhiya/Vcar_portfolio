  <text x="280" y="213" fill="#a0a0a5" font-family="sans-serif" font-size="10" font-weight="600">ITEM DESCRIPTION</text>
  <text x="470" y="213" fill="#a0a0a5" font-family="sans-serif" font-size="10" font-weight="600">QTY</text>
  <text x="540" y="213" fill="#a0a0a5" font-family="sans-serif" font-size="10" font-weight="600">RATE</text>
  <text x="650" y="213" fill="#a0a0a5" font-family="sans-serif" font-size="10" font-weight="600">AMOUNT</text>
  <line x1="265" y1="223" x2="730" y2="223" stroke="#2c2d35" stroke-width="1"/>

  <text x="280" y="246" fill="#d6d6d6" font-family="sans-serif" font-size="11">Industrial Hardware Assembly A</text>
  <text x="475" y="246" fill="#d6d6d6" font-family="monospace" font-size="11">12</text>
  <text x="540" y="246" fill="#d6d6d6" font-family="monospace" font-size="11">₹4,200</text>
  <text x="650" y="246" fill="#ffdb70" font-family="monospace" font-size="11" font-weight="600">₹50,400</text>

  <text x="280" y="274" fill="#d6d6d6" font-family="sans-serif" font-size="11">Network Cabling &amp; Switch Rack 24P</text>
  <text x="475" y="274" fill="#d6d6d6" font-family="monospace" font-size="11">4</text>
  <text x="540" y="274" fill="#d6d6d6" font-family="monospace" font-size="11">₹8,500</text>
  <text x="650" y="274" fill="#ffdb70" font-family="monospace" font-size="11" font-weight="600">₹34,000</text>

  <text x="280" y="302" fill="#d6d6d6" font-family="sans-serif" font-size="11">Field Deployment &amp; System Setup</text>
  <text x="475" y="302" fill="#d6d6d6" font-family="monospace" font-size="11">1</text>
  <text x="540" y="302" fill="#d6d6d6" font-family="monospace" font-size="11">₹12,000</text>
  <text x="650" y="302" fill="#ffdb70" font-family="monospace" font-size="11" font-weight="600">₹12,000</text>

  <line x1="265" y1="318" x2="730" y2="318" stroke="#2c2d35" stroke-width="1"/>
  
  <text x="510" y="337" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">SUBTOTAL (GST 18%):</text>
  <text x="640" y="337" fill="#ffdb70" font-family="monospace" font-size="14" font-weight="800">₹1,13,752</text>

  <!-- Action Bar -->
  <rect x="265" y="375" width="220" height="35" rx="6" fill="url(#goldOrb)"/>
  <text x="375" y="397" fill="#121212" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">PRINT / EXPORT ESTIMATE</text>

  <rect x="500" y="375" width="230" height="35" rx="6" fill="#1f2029" stroke="#363740" stroke-width="1"/>
  <text x="615" y="397" fill="#d6d6d6" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">SAVE TO SQLITE CLOUD</text>

  <text x="265" y="435" fill="#a0a0a5" font-family="sans-serif" font-size="10">Built with React, TypeScript, Tailwind CSS, Vite &amp; SQLite</text>
</svg>
