<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="meterGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffdb70"/>
      <stop offset="100%" stop-color="#e0aa3e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#pwBg)"/>
  
  <!-- Outer Window -->
  <rect x="25" y="25" width="750" height="450" rx="12" fill="#1b1c21" stroke="#373842" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="25" y="25" width="750" height="48" rx="12" fill="#24252c"/>
  <rect x="25" y="60" width="750" height="13" fill="#24252c"/>
  <line x1="25" y1="73" x2="775" y2="73" stroke="#373842" stroke-width="1"/>
  
  <circle cx="50" cy="49" r="6" fill="#ff5f56"/>
  <circle cx="68" cy="49" r="6" fill="#ffbd2e"/>
  <circle cx="86" cy="49" r="6" fill="#27c93f"/>
  
  <text x="400" y="54" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Password Strength &amp; Vulnerability Checker — Python Security Utility</text>

  <!-- Main Card Centered Container -->
  <rect x="75" y="95" width="650" height="355" rx="12" fill="#141418" stroke="#2c2d35" stroke-width="1"/>
  
  <!-- Shield Icon & Header in Card -->
  <circle cx="120" cy="140" r="26" fill="#262319" stroke="#ffdb70" stroke-width="1.5"/>
  <!-- Keyhole / Lock Icon inside Shield -->
  <path d="M 114 135 A 6 6 0 0 1 126 135 L 126 148 L 114 148 Z" fill="none" stroke="#ffdb70" stroke-width="2"/>
  <rect x="111" y="139" width="18" height="13" rx="2" fill="#ffdb70"/>
  <circle cx="120" cy="145" r="2" fill="#141418"/>

  <text x="160" y="136" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Authentication Security Evaluator</text>
  <text x="160" y="154" fill="#a0a0a5" font-family="sans-serif" font-size="12">Real-time Entropy Calculation &amp; Dictionary Defense Analysis</text>

  <!-- Password Input Field Box -->
  <rect x="100" y="180" width="600" height="52" rx="8" fill="#1c1d24" stroke="#ffdb70" stroke-width="1.5"/>
  <text x="125" y="212" fill="#ffffff" font-family="monospace" font-size="16" letter-spacing="4">Tr0ub4dor&amp;3#99Secure!</text>
  <rect x="585" y="193" width="95" height="26" rx="4" fill="#262319" stroke="#ffdb70" stroke-width="1"/>
  <text x="632" y="210" fill="#ffdb70" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">92% STRONG</text>

  <!-- Dynamic Strength Bar -->
  <rect x="100" y="244" width="600" height="8" rx="4" fill="#252630"/>
  <rect x="100" y="244" width="552" height="8" rx="4" fill="url(#meterGold)"/>

  <!-- Left: Security Validation Rules List -->
  <rect x="100" y="270" width="285" height="160" rx="8" fill="#18191f" stroke="#2c2d35" stroke-width="1"/>
  <text x="115" y="293" fill="#ffdb70" font-family="sans-serif" font-size="11" font-weight="700">SECURITY CRITERIA MET</text>
  
  <text x="115" y="320" fill="#78c878" font-family="sans-serif" font-size="12">✔ 16 Characters Length (Min 12)</text>
  <text x="115" y="344" fill="#78c878" font-family="sans-serif" font-size="12">✔ Mixed Case: Upper &amp; Lower</text>
  <text x="115" y="368" fill="#78c878" font-family="sans-serif" font-size="12">✔ Numeric &amp; Special Symbols</text>
  <text x="115" y="392" fill="#78c878" font-family="sans-serif" font-size="12">✔ No Dictionary Word Matches</text>
  <text x="115" y="416" fill="#78c878" font-family="sans-serif" font-size="12">✔ No Common Keystroke Patterns</text>

  <!-- Right: Cryptographic Entropy Analytics -->
  <rect x="415" y="270" width="285" height="160" rx="8" fill="#18191f" stroke="#2c2d35" stroke-width="1"/>
  <text x="430" y="293" fill="#ffdb70" font-family="sans-serif" font-size="11" font-weight="700">ENTROPY &amp; CRACK ESTIMATE</text>

  <rect x="430" y="310" width="120" height="48" rx="6" fill="#222019" stroke="#ffdb70" stroke-width="0.75"/>
  <text x="440" y="328" fill="#a0a0a5" font-family="sans-serif" font-size="10">ENTROPY SCORE</text>
  <text x="440" y="350" fill="#ffdb70" font-family="monospace" font-size="16" font-weight="700">89.4 bits</text>

  <rect x="565" y="310" width="120" height="48" rx="6" fill="#1c221c" stroke="#387038" stroke-width="0.75"/>
  <text x="575" y="328" fill="#a0a0a5" font-family="sans-serif" font-size="10">BRUTE FORCE TIME</text>
  <text x="575" y="350" fill="#78c878" font-family="monospace" font-size="15" font-weight="700">3.4M Years</text>

  <text x="430" y="385" fill="#d6d6d6" font-family="sans-serif" font-size="11">Validation Engine: NIST SP 800-63B Compliant</text>
  <text x="430" y="405" fill="#a0a0a5" font-family="monospace" font-size="10">Python hashlib + zxcvbn rule analysis</text>
  <text x="430" y="420" fill="#ffdb70" font-family="sans-serif" font-size="10" font-weight="600">Status: High Resilience Verified</text>
</svg>
