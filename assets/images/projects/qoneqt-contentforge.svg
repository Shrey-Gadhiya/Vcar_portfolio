  <rect x="70" y="400" width="400" height="35" rx="4" fill="#16151e"/>
  <path d="M 85 418 Q 95 405 105 418 T 125 418 T 145 408 T 165 418 T 185 428 T 205 418 T 225 405 T 245 418 T 265 425 T 285 418 T 305 410 T 325 418 T 345 422 T 365 418 T 385 408 T 405 418 T 425 425 T 445 418" fill="none" stroke="#ffdb70" stroke-width="1.8"/>

